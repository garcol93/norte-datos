name: Sondeo de radar móvil

# Mide si los tramos de radar móvil que publica la DGT (PDF «INFORME_CINEMOMETROS»
# en «Equipos y tramos de vigilancia») se pueden situar con los hitos
# kilométricos de OSM. También cuenta las zonas de bajas emisiones de OSM.
# No publica datos: deja un informe en la release «sondeo».
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sondeo-radar-movil.yml
      - scripts/sondeo_radar_movil.py

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -q pdfplumber
      - name: PDF de la DGT
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) norte-datos"
          PAG="https://www.dgt.es/conoce-el-estado-del-trafico/vigilancia-y-control/equipos-y-tramos-de-vigilancia/"
          {
          echo "# Sondeo de radar móvil · $(date -u +%FT%TZ)"
          curl -sL -A "$UA" -m 90 -o pagina.html -w "página → HTTP %{http_code} · %{size_download} bytes\n" "$PAG"
          echo "enlaces a documentos:"
          grep -oiE 'href="[^"]+\.(pdf|xlsx?|csv|kml|kmz|json)"' pagina.html | sort -u | sed 's/^/   /'
          url=$(grep -oiE 'href="[^"]*INFORME_CINEMOMETROS[^"]*\.pdf"' pagina.html | head -1 | sed -E 's/^href="//; s/"$//')
          case "$url" in /*) url="https://www.dgt.es$url";; esac
          echo "PDF: $url"
          curl -sL -A "$UA" -m 120 -o informe.pdf -w "PDF → HTTP %{http_code} · %{size_download} bytes\n" "$url"
          echo "sha256: $(sha256sum informe.pdf | cut -c1-64)"
          python3 -c "import pdfplumber;p=pdfplumber.open('informe.pdf');print('páginas',len(p.pages));print((p.pages[0].extract_text() or '')[:2500]);print('--- pág. 2');print((p.pages[1].extract_text() or '')[:1200] if len(p.pages)>1 else '')"
          } 2>&1 | tee informe-radar-movil.txt
      - name: Hitos y vías de OSM
        run: |
          curl -sfL --retry 3 -o espana.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          osmium tags-filter espana.osm.pbf n/highway=milestone -o hitos.osm.pbf
          osmium export hitos.osm.pbf -f geojsonseq --geometry-types=point -o hitos.geojsonseq
          osmium tags-filter espana.osm.pbf w/highway=motorway,trunk,primary,secondary,tertiary,motorway_link,trunk_link -o vias.osm.pbf
          osmium export vias.osm.pbf -f geojsonseq --geometry-types=linestring -o vias.geojsonseq
          osmium tags-filter espana.osm.pbf boundary=low_emission_zone -o zbe.osm.pbf
          osmium export zbe.osm.pbf -f geojsonseq --geometry-types=polygon -o zbe.geojsonseq
      - name: Medir
        run: |
          set +e
          {
          echo; echo "## Tramos y hitos"
          python3 scripts/sondeo_radar_movil.py informe.pdf hitos.geojsonseq vias.geojsonseq
          echo; echo "## Zonas de bajas emisiones en OSM (España)"
          echo "polígonos: $(wc -l < zbe.geojsonseq)"
          python3 -c "
          import json
          for l in open('zbe.geojsonseq'):
              p=json.loads(l.lstrip('\x1e'))['properties']
              print('  ·', p.get('name'), '|', {k:v for k,v in p.items() if k not in ('name','type','boundary')})
          " | cut -c1-260
          } 2>&1 | tee -a informe-radar-movil.txt
      - name: Publicar informe
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload sondeo informe-radar-movil.txt informe.pdf -R "$GITHUB_REPOSITORY" --clobber
